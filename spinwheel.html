<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>spin wheel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="spinwheel.js" defer></script>
</head>
<body>
    <div class="text-center mt-5">
        <h1 class="bg-ready text-dark">Click to spin the wheel</h1>
        <button id="spin" class="btn btn-danger btn-lg style=display:block" onclick="spin()">Spin!</button>
    </div>
    <div class="text-center m-5">
    <img id="spinwheel"src="images/spin.gif" style="display:none"  width="250px" >
    
    </div>
    <div class="text-center m-5">
        <h1 id="winner" class="text-info  bg-success"></h1>
    </div>
    <div class="text-center mt-5">
        <button id="spinagain" style="display:none" class="btn btn-danger btn-lg" onclick="spinagain()">Spin Again!</button>
    </div>
</body>
</html>
